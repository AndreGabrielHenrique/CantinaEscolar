<!-- Caminho relativo: index.html -->
<!-- Este é o arquivo HTML principal do projeto, que serve como ponto de entrada para a aplicação React. -->

<!DOCTYPE html>
<!-- Declaração do tipo de documento HTML5, necessária para que o navegador interprete corretamente a página. -->
<html lang="pt-BR">
  <!-- Elemento raiz da página, com atributo lang definido para português do Brasil para acessibilidade e SEO. -->
  <head>
    <!-- Seção head: contém metadados sobre a página, não visíveis ao usuário. -->
    <meta charset="UTF-8" />
    <!-- Meta tag para definir a codificação de caracteres como UTF-8, garantindo suporte a caracteres especiais. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Meta tag para configurar a viewport, tornando a página responsiva em dispositivos móveis. -->
    <title>Cantina Escolar</title>
    <!-- Título da página, exibido na aba do navegador. -->
    <meta
      name="description"
      content="Projeto de análise da cantina escolar com React, Vite e SASS." />
    <!-- Meta tag de descrição para SEO, descrevendo o conteúdo da página para motores de busca. -->
  </head>
  <body>
    <!-- Corpo da página: contém o conteúdo visível ao usuário. -->
    <div id="root"></div>
    <!-- Div com id 'root': ponto de montagem onde o React renderiza a aplicação. -->
    <script type="module" src="/src/main.jsx"></script>
    <!-- Script que carrega o módulo principal da aplicação React, iniciando o app. -->
  </body>
</html>
